[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexalab-content-tool"
version = "0.1.0"
description = "Local-first content preparation CLI for NexaLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.26,<2",
]

[project.scripts]
nexalab-content = "nexalab_content_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexalab_content_tool = ["m1_ui.html"]
